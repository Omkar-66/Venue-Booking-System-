<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - VenueBooking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Glassmorphism CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Glass Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon"><i class="bi bi-building-fill-gear"></i></span>
                <span class="brand-font">Venue<span class="text-gradient">Booking</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="venues.html">Explore Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="availability-calendar.html">Availability</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="auth.html">Sign In</a></li>
                    <li class="nav-item ms-lg-2">
                        <a href="booking.html" class="btn btn-book-nav">Book Venue</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="glass-panel p-4 p-md-5">
                    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-white" id="pills-signin-tab" data-bs-toggle="pill" data-bs-target="#pills-signin" type="button" role="tab">Sign In</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white" id="pills-signup-tab" data-bs-toggle="pill" data-bs-target="#pills-signup" type="button" role="tab">Sign Up</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        <!-- Sign In Form -->
                        <div class="tab-pane fade show active" id="pills-signin" role="tabpanel">
                            <form id="signin-form">
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">Username / Email</label>
                                    <input type="text" class="form-control form-control-glass" id="signin-username" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small fw-bold">Password</label>
                                    <input type="password" class="form-control form-control-glass" id="signin-password" required>
                                </div>
                                <button type="submit" class="btn btn-gradient w-100 mb-3">Sign In</button>
                            </form>
                        </div>

                        <!-- Sign Up Form -->
                        <div class="tab-pane fade" id="pills-signup" role="tabpanel">
                            <form id="signup-form">
                                <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">Choose Username</label>
                                    <input type="text" class="form-control form-control-glass" id="username" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small fw-bold">Choose Password</label>
                                    <input type="password" class="form-control form-control-glass" id="password" required>
                                </div>
                                <button type="submit" class="btn btn-gradient w-100 mb-3">Create Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-glass text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 VenueBooking. Secure Authentication.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application Logic & AI Chatbot -->
    <script src="script.js"></script>
</body>
</html>
