<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - VenueBooking</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Glassmorphism CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Glass Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon"><i class="bi bi-building-fill-gear"></i></span>
                <span class="brand-font">Venue<span class="text-gradient">Booking</span></span>
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="venues.html">Explore Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="availability-calendar.html">Availability</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="auth.html">Sign In</a></li>
                    <li class="nav-item ms-lg-2">
                        <a href="booking.html" class="btn btn-book-nav">Book Venue</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="container my-4 text-center">
        <span class="badge badge-primary-glass mb-2 px-3 py-1"><i class="bi bi-envelope-fill"></i> Get In Touch</span>
        <h1 class="text-white">Contact Our <span class="text-gradient">Support Team</span></h1>
        <p class="text-muted">Have questions about venue amenities, custom quotes, or event planning? We're here to help.</p>
    </header>

    <div class="container mb-5">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-7">
                <div class="glass-panel p-4 p-md-5">
                    <form id="contact-form">
                        <div class="mb-3">
                            <label for="contact-name" class="form-label text-muted small fw-bold">Your Name</label>
                            <input type="text" class="form-control form-control-glass" id="contact-name" placeholder="Name" required>
                        </div>
                        <div class="mb-3">
                            <label for="contact-email" class="form-label text-muted small fw-bold">Your Email</label>
                            <input type="email" class="form-control form-control-glass" id="contact-email" placeholder="email@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="contact-message" class="form-label text-muted small fw-bold">Message</label>
                            <textarea class="form-control form-control-glass" id="contact-message" rows="4" placeholder="How can we help you?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100"><i class="bi bi-send-fill me-2"></i>Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-glass text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 VenueBooking. 24/7 Support.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application Logic & AI Chatbot -->
    <script src="script.js"></script>
</body>
</html>
